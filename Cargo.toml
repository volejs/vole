[workspace]
members = [
    "crates/cmd",
    "crates/core",
    "crates/runtime",
    "crates/modules",
    "crates/package",
    "crates/global_bindings/*",
    "crates/raw_bindings/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/volejs/vole"
homepage = "https://github.com/volejs/vole"
documentation = "https://github.com/volejs/vole"
readme = "README.md"
keywords = ["javascript", "typescript", "runtime", "quickjs", "webapi"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
vole-module = { path = "crates/modules" }

rquickjs = "0.12"
rquickjs-serde = "0.6.1"

tokio = "1"
thiserror = "1.0"
serde_json = "1.0"
rust-embed = "8"

axum = "0.8"
reqwest = "0.12"

base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
cipher = "0.4"
rand = "0.8"
getrandom = "0.2"
pkcs8 = "0.10"
rsa = "0.9"
spki = "0.7"

url = "2.5"
percent-encoding = "2.3"

flate2 = "1.0"

libffi = "4.1"
libloading = "0.8"

wasmi = "2.0.0-beta.2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
