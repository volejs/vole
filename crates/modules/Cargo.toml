[package]
name = "vole-module"
version = "0.1.0"
edition = "2024"


[dependencies]
rquickjs = { version = "0.12", features = ["loader"] }
rust-embed = { workspace = true, features = ["debug-embed"] }
thiserror = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_yaml = "0.9"
json5 = "0.4"
oxc_allocator = "0.110.0"
oxc_parser = "0.110.0"
oxc_codegen = "0.110.0"
oxc_span = "0.110.0"
oxc_semantic = "0.110.0"
oxc_transformer = "0.110.0"
