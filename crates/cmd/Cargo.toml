[package]
name = "vole-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vole"
path = "src/main.rs"

[dependencies]
vole-runtime = { path = "../core" }
vole-package = { path = "../package" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
notify = "6"
toml = "0.8"
