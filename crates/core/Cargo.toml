[package]
name = "vole-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rquickjs = { workspace = true, features = ["macro"] }
base64-simd = { version = "0.8", features = ["alloc"] }
hex-simd = { version = "0.8", features = ["alloc"], default-features = false }
phf = { version = "0.13", features = ["macros"], default-features = false }
memchr = { version = "2", default-features = false }
itoa = { version = "1", default-features = false }
ryu = { version = "1", default-features = false }
simd-json = { version = "0.17", features = ["big-int-as-float"], default-features = false }
tokio = { workspace = true, features = ["sync"] }
