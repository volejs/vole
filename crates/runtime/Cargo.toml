[package]
name = "vole-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
rquickjs = { workspace = true, features = ["futures", "loader"] }
vole-core = { path = "../core" }
vole-module = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
vole-global-base64 = { path = "../global_bindings/base64" }
vole-global-blob = { path = "../global_bindings/blob" }
vole-global-compression = { path = "../global_bindings/compression" }
vole-global-console = { path = "../global_bindings/console" }
vole-global-crypto = { path = "../global_bindings/crypto" }
vole-global-dom_exception = { path = "../global_bindings/dom_exception" }
vole-global-encoding = { path = "../global_bindings/encoding" }
vole-global-events = { path = "../global_bindings/events" }
vole-global-fetch = { path = "../global_bindings/fetch" }
vole-global-performance = { path = "../global_bindings/performance" }
vole-global-report_error = { path = "../global_bindings/report_error" }
vole-global-streams = { path = "../global_bindings/streams" }
vole-global-structured_clone = { path = "../global_bindings/structured_clone" }
vole-global-timers = { path = "../global_bindings/timers" }
vole-global-url = { path = "../global_bindings/url" }
vole-raw-dns = { path = "../raw_bindings/dns" }
vole-raw-ffi = { path = "../raw_bindings/ffi" }
vole-raw-http = { path = "../raw_bindings/http" }
vole-raw-socket = { path = "../raw_bindings/socket" }
vole-raw-tcp = { path = "../raw_bindings/tcp" }
vole-raw-udp = { path = "../raw_bindings/udp" }
vole-raw-env = { path = "../raw_bindings/env" }
vole-raw-exec = { path = "../raw_bindings/exec" }
vole-raw-signal = { path = "../raw_bindings/signal" }
vole-raw-fs = { path = "../raw_bindings/fs" }
vole-raw-path = { path = "../raw_bindings/path" }
vole-raw-os = { path = "../raw_bindings/os" }
vole-raw-until = { path = "../raw_bindings/until" }
vole-raw-wasm = { path = "../raw_bindings/wasm" }
