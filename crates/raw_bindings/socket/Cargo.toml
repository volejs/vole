[package]
name = "vole-raw-socket"
version = "0.1.0"
edition = "2024"

authors = ["vole-runtime"]

description = "Raw Unix socket bindings for vole runtime"

[dependencies]
rquickjs = { workspace = true, features = ["futures", "loader"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
