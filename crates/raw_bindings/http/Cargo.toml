[package]
name = "vole-raw-http"
version = "0.1.0"
edition = "2024"

authors = ["vole-runtime"]

description = "Raw HTTP bindings for vole runtime"

[dependencies]
rquickjs = { workspace = true, features = ["futures", "loader"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
axum = { workspace = true }
